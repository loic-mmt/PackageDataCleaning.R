template:
  bootstrap: 5
  bootswatch: Minty

reference:
  - title: "Validation"
    desc: "Vérifier que les fichiers sont conformes."
    contents:
      - read_raw_csv
      - validate_schema
      - validate_ranges
      - standardize_colnames

  - title: "Normalisation"
    desc: "Standardisation des colonnes et des formats."
    contents:
      - normalize_all
      - normalize_factor
      - normalize_remote_ratio
      - deduplicate_rows
      - enforce_types

  - title: " Valeurs Manquantes"
    desc: "Gérer les NA."
    contents:
      - impute_missing

  - title: " Finance"
    desc: "Conversion des devises."
    contents:
      - convert_currency_to_usd

  - title: " Qualité des Données"
    desc: "Détection des outliers et règles métier."
    contents:
      - cap_outliers_salary

  - title: " Export"
    contents:
      - export_csv
      - write_cleaning_report

  - title: "Pipeline"
    contents:
    - cleaning_pipeline
    - finalize_salary_tbl

